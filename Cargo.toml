[package]
name = "pair-ui"
description = "Host one web page that a person and an agent drive together, on 127.0.0.1"
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "0BSD"
repository = "https://github.com/cyberchitta/pair-ui"
publish = false

[features]
default = ["host"]
host = ["dep:bytes", "dep:getrandom", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:tokio"]

[dependencies]
bytes = { version = "1", optional = true }
getrandom = { version = "0.4", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "sync", "time"], optional = true }

[[bin]]
name = "pair-ui"
required-features = ["host"]

[[test]]
name = "host"
required-features = ["host"]

[[test]]
name = "cli"
required-features = ["host"]

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
